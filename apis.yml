name: Popsa
description: >-
  Popsa is a UK-based, mobile-first photo printing company that uses AI to help
  customers create photo books, calendars, prints, tiles, boxes and ornaments in
  minutes. Founded in the UK and a certified B Corporation that offsets 100% of
  production and shipping carbon emissions, Popsa serves over 10 million
  customers and ships to more than 50 countries with localised storefronts
  across Europe, North America and Australia. Its differentiators are AI-powered
  automatic layouts, generative captions, facial recognition, print-quality
  scoring and dynamic colour themes, delivering an average five-minute creation
  time. Popsa was surfaced as a 500 Global portfolio company and added to the
  API Evangelist network. It publishes no public developer API, SDK or developer
  portal; this profile captures its public discovery surface (llms.txt,
  security.txt) and domain security posture instead.
